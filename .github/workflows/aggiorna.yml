name: Promemoria aggiornamento mensile

on:
  schedule:
    - cron: "0 6 25 * *"   # il 25: ANAC pubblica gli aggiornamenti mensili tra il 2 e il 22
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  promemoria:
    runs-on: ubuntu-latest
    steps:
      - name: Apri la issue-promemoria
        uses: actions/github-script@v7
        with:
          script: |
            const oggi = new Date();
            const am = `${oggi.getFullYear()}${String(oggi.getMonth() + 1).padStart(2, "0")}`;
            const scorso = new Date(oggi.getFullYear(), oggi.getMonth() - 1, 1);
            const a = scorso.getFullYear();
            const m = String(scorso.getMonth() + 1).padStart(2, "0");
            const base = "https://dati.anticorruzione.it/opendata/download/dataset";
            const titolo = `Aggiornamento dati ANAC: ${am.slice(0, 4)}-${am.slice(4)}`;
            const corpo = [
              `È il momento di aggiornare l'archivio con le pubblicazioni ANAC del mese.`,
              ``,
              `ANAC non permette il download automatico dai server (blocca gli IP esteri), quindi l'aggiornamento va lanciato dal tuo computer.`,
              ``,
              `Il blocco scarica gli aggiornamenti mensili di aggiudicazioni e aggiudicatari e i file CIG del ${a} fino a ${a}-${m} non ancora in archivio, se ANAC li ha pubblicati. Un file non ancora pubblicato viene segnalato e saltato. Apri il Terminale e incolla:`,
              ``,
              "```bash",
              `cd ~/osservatorio`,
              `for d in aggiudicazioni aggiudicatari; do curl -fL --retry 5 -o dati-grezzi/${am}01-$d"_csv.zip" "${base}/$d/filesystem/${am}01-$d"_csv.zip" || { echo "manca ${am}01-$d"; rm -f dati-grezzi/${am}01-$d"_csv.zip"; }; done`,
              `for mm in $(seq -w 1 ${m}); do [ -f output/accoglienza_${a}_$mm.csv ] && continue; if curl -sfL --retry 5 -o dati-grezzi/cig_csv_${a}_$mm.zip "${base}/cig-${a}/filesystem/cig_csv_${a}_$mm.zip"; then unzip -o dati-grezzi/cig_csv_${a}_$mm.zip -d dati-grezzi/ && python3 script/estrai2.py dati-grezzi/cig_csv_${a}_$mm.csv && mv accoglienza_${a}_$mm.csv output/ && rm dati-grezzi/cig_csv_${a}_$mm.csv; else echo "CIG ${a}-$mm non ancora pubblicato"; rm -f dati-grezzi/cig_csv_${a}_$mm.zip; fi; done`,
              `python3 script/costruisci.py`,
              `git add output sito/data`,
              `git commit -m "Dati ANAC ${am.slice(0, 4)}-${am.slice(4)}"`,
              `git push`,
              "```",
              ``,
              `Se \`git commit\` risponde che non c'è nulla da salvare, ANAC non ha pubblicato niente di nuovo: chiudi la issue.`,
              ``,
              `Dopo il push Vercel ridistribuisce da solo: https://osservatorioaccoglienza.org`,
              ``,
              `Quando hai finito, chiudi questa issue.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titolo, body: corpo,
            });
